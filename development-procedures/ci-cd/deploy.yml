# GitHub Actions Workflow - Deploy to Production
# Runs when code is pushed to main branch

name: Deploy to Production

on:
  push:
    branches: [ main ]

jobs:
  test:
    name: Pre-deployment Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Run all tests
      run: |
        python -m pytest tests/ -v --tb=short

    - name: Check test coverage
      run: |
        python -m pytest tests/ --cov=nail_salon_checkin --cov-report=term
        # Require minimum 80% coverage
        # python -m pytest tests/ --cov=nail_salon_checkin --cov-fail-under=80

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    if: success()

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy to Render
      run: |
        echo "✅ Deployment to Render triggered via webhook"
        echo "Render will automatically build and deploy from main branch"
        echo "Monitor deployment at: https://dashboard.render.com/"

    # Note: Render uses automatic deployment from main branch
    # To trigger via API:
    # - name: Trigger Render Deploy
    #   run: |
    #     curl -X POST https://api.render.com/deploy/srv-xxxxx \
    #       -H "Authorization: Bearer ${{ secrets.RENDER_DEPLOY_HOOK }}"

    - name: Verify deployment
      run: |
        echo "⏳ Waiting for Render deployment (typically 2-5 minutes)..."
        # Optional: Add deployment verification script here
        # ./development-procedures/scripts/verify-deployment.sh

    - name: Notification
      if: success()
      run: |
        echo "🎉 Deployment successful!"
        echo "Production URL: https://nail-salon-checkin.onrender.com/"

    - name: Deployment Failed
      if: failure()
      run: |
        echo "❌ Deployment failed"
        echo "Check Render dashboard for error details"
        exit 1
