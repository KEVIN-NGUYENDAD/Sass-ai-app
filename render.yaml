services:
  # 🔒 Network Security Audit Backend (Flask API)
  - type: web
    name: network-security-audit-backend
    env: python
    plan: free
    rootDir: salon-hub/backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DEBUG
        value: "False"

  # 🎨 Network Security Audit Frontend (React)
  - type: static_site
    name: network-security-audit-frontend
    plan: free
    rootDir: salon-hub/frontend
    buildCommand: npm install && npm run build
    publicPath: build
    envVars:
      - key: REACT_APP_API_URL
        value: https://network-security-audit-backend.onrender.com