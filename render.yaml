services:
  - type: web
    name: huong-pharmacy-ai-copilot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app

  - type: web
    name: nail-salon-checkin
    env: python
    rootDir: nail_salon_checkin
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app