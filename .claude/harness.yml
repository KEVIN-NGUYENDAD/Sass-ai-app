name: Huong Pharmacy AI Copilot
description: Harness configuration for Python Flask projects with check-in system
version: "1.0"

# Environment setup
environment:
  runtime: python3.9+
  package_manager: pip
  shell: bash

# Project structure
structure:
  source_dirs:
    - nail_salon_checkin
    - development-procedures
  test_dirs:
    - tests
  config_files:
    - requirements.txt
    - .env.example

# Setup hooks - chạy khi thiết lập harness
setup:
  steps:
    - name: "Install dependencies"
      command: "pip install -r requirements.txt"
      cwd: "nail_salon_checkin"
      required: true

    - name: "Create data directory"
      command: "mkdir -p nail_salon_checkin/data"
      required: false

# Development commands
commands:
  dev:
    - name: "start-server"
      description: "Khởi động Flask development server"
      command: "python app.py"
      cwd: "nail_salon_checkin"
      port: 5000
      healthcheck: "http://localhost:5000/"

  test:
    - name: "run-tests"
      description: "Chạy unit tests"
      command: "bash development-procedures/scripts/run-tests.sh all"
      required: true

    - name: "lint-code"
      description: "Kiểm tra code quality"
      command: "python -m flake8 nail_salon_checkin/ --max-line-length=120"
      required: false

  deploy:
    - name: "verify-deployment"
      description: "Xác minh deployment"
      command: "bash development-procedures/scripts/verify-deployment.sh"
      required: false

# CI/CD pipeline
pipeline:
  stages:
    - name: "lint"
      commands:
        - "python -m flake8 nail_salon_checkin/ --max-line-length=120"
      on_failure: "warn"

    - name: "test"
      commands:
        - "bash development-procedures/scripts/run-tests.sh all"
      on_failure: "fail"

    - name: "build"
      commands:
        - "mkdir -p build"
        - "cp -r nail_salon_checkin build/"
      on_failure: "fail"

# Pre-commit hooks
hooks:
  pre-commit:
    - name: "check-syntax"
      command: "python -m py_compile nail_salon_checkin/*.py"
      on_failure: "warn"

# Code review configuration
review:
  checklist: "development-procedures/templates/CODE_REVIEW_CHECKLIST.md"
  required_approval: 1
  check_tests: true
  check_lint: true

# Deployment configuration
deployment:
  platform: "render"
  auto_deploy_branches:
    - "main"
  verification_script: "development-procedures/scripts/verify-deployment.sh"
  post_deploy:
    - name: "health-check"
      command: "curl -f $DEPLOY_URL/health || exit 1"

# Environment variables
env_vars:
  FLASK_APP: "app.py"
  FLASK_ENV: "development"
  PYTHONUNBUFFERED: "1"

# Development procedures
procedures:
  code_review: "development-procedures/templates/CODE_REVIEW_CHECKLIST.md"
  qa_checklist: "development-procedures/templates/QA_CHECKLIST.md"
  deployment: "development-procedures/templates/DEPLOYMENT_VERIFICATION.md"
  quick_reference: "development-procedures/QUICK_REFERENCE.md"

# Performance targets
targets:
  test_coverage: 80
  performance_score: 95
  response_time_ms: 500

# Tags cho tìm kiếm/tổ chức
tags:
  - python
  - flask
  - check-in-system
  - salon-management
  - api
  - web-app
  - responsive-design
  - twilio-sms
