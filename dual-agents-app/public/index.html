<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🤖 Dual Agent System</title>
  <style>
    :root {
      --accent-primary: #4F46E5;
      --accent-secondary: #14B8A6;
      --bg-primary: #F9F7F4;
      --bg-secondary: #FFFFFF;
      --text-primary: #1F2937;
      --text-secondary: #6B7280;
      --border-color: #E5E7EB;
      --success: #10B981;
      --warning: #F59E0B;
      --error: #EF4444;

      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --font-mono: "Monaco", "Courier New", monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg-primary: #0F172A;
        --bg-secondary: #1E293B;
        --text-primary: #F1F5F9;
        --text-secondary: #94A3B8;
        --border-color: #334155;
      }
    }

    :root[data-theme="dark"] {
      --bg-primary: #0F172A;
      --bg-secondary: #1E293B;
      --text-primary: #F1F5F9;
      --text-secondary: #94A3B8;
      --border-color: #334155;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
    }

    .container {
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 280px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 20px;
      overflow-y: auto;
    }

    .sidebar-header {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .agents-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .agent-btn {
      padding: 16px;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      background: var(--bg-primary);
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
    }

    .agent-btn:hover {
      border-color: var(--accent-primary);
      background: var(--bg-secondary);
    }

    .agent-btn.active {
      background: var(--accent-primary);
      border-color: var(--accent-primary);
      color: white;
    }

    .agent-btn.active .agent-name,
    .agent-btn.active .agent-desc {
      color: white;
    }

    .agent-icon {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .agent-name {
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 4px;
      color: var(--text-primary);
    }

    .agent-desc {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    .sidebar-footer {
      margin-top: auto;
      padding-top: 20px;
      border-top: 1px solid var(--border-color);
    }

    .server-status {
      font-size: 12px;
      padding: 8px;
      border-radius: 4px;
      text-align: center;
      background: var(--warning);
      color: white;
    }

    .server-status.ready {
      background: var(--success);
    }

    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-primary);
    }

    .chat-header {
      padding: 20px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-header-icon {
      font-size: 28px;
    }

    .chat-header-text h2 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .chat-header-text p {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      display: flex;
      gap: 12px;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      justify-content: flex-end;
    }

    .message-bubble {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 12px;
      word-wrap: break-word;
      line-height: 1.5;
    }

    .message.user .message-bubble {
      background: var(--accent-primary);
      color: white;
    }

    .message.agent .message-bubble {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
    }

    .message-sender {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 4px;
      font-weight: 600;
    }

    .message.user .message-sender {
      text-align: right;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 16px;
      color: var(--text-secondary);
    }

    .empty-state-icon {
      font-size: 48px;
      opacity: 0.5;
    }

    .input-area {
      padding: 20px;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 12px;
    }

    .input-wrapper {
      flex: 1;
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    .input-field {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-family: var(--font-sans);
      font-size: 14px;
      resize: none;
      max-height: 100px;
      background: var(--bg-primary);
      color: var(--text-primary);
      transition: border-color 0.2s;
    }

    .input-field:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    .input-field:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .char-count {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 4px;
      text-align: right;
    }

    .char-count.warning {
      color: var(--warning);
    }

    .char-count.error {
      color: var(--error);
    }

    .send-btn {
      padding: 12px 16px;
      background: var(--accent-primary);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.2s;
      min-width: 60px;
    }

    .send-btn:hover:not(:disabled) {
      opacity: 0.9;
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .loading {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-primary);
      animation: pulse 1.5s ease-in-out infinite;
      margin-right: 8px;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    .error-message {
      background: var(--error);
      color: white;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    @media (max-width: 768px) {
      .sidebar {
        width: 200px;
        padding: 15px;
      }

      .message-bubble {
        max-width: 85%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <div class="sidebar-header">🤖 Agents</div>

      <div class="agents-list">
        <button class="agent-btn active" data-agent="cybersecurity">
          <div class="agent-icon">🔒</div>
          <div class="agent-name">Cybersecurity Expert</div>
          <div class="agent-desc">CCNA, Network Security</div>
        </button>

        <button class="agent-btn" data-agent="aiml">
          <div class="agent-icon">🧠</div>
          <div class="agent-name">AI/ML Expert</div>
          <div class="agent-desc">Claude API, Prompts</div>
        </button>
      </div>

      <div class="sidebar-footer">
        <div class="server-status" id="serverStatus">Connecting...</div>
      </div>
    </div>

    <div class="chat-container">
      <div class="chat-header">
        <div class="chat-header-icon" id="agentIcon">🔒</div>
        <div class="chat-header-text">
          <h2 id="agentName">Cybersecurity Expert</h2>
          <p id="agentSubtitle">CCNA, Network Security, Firewalls</p>
        </div>
      </div>

      <div class="messages" id="messages">
        <div class="empty-state">
          <div class="empty-state-icon">💬</div>
          <div>Start chatting with the agent</div>
        </div>
      </div>

      <div class="input-area">
        <div class="input-wrapper">
          <div style="flex: 1;">
            <textarea
              class="input-field"
              id="messageInput"
              placeholder="Ask me anything..."
              rows="1"
              maxlength="5000"
              aria-label="Message input"
            ></textarea>
            <div class="char-count" id="charCount">0 / 5000</div>
          </div>
          <button
            class="send-btn"
            id="sendBtn"
            aria-label="Send message"
            title="Send (Enter)"
          >Send</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const AGENTS = {
      cybersecurity: {
        name: "Cybersecurity Expert",
        icon: "🔒",
        subtitle: "CCNA, Network Security, Firewalls & VLANs",
      },
      aiml: {
        name: "AI/ML Expert",
        icon: "🧠",
        subtitle: "Claude API, LLM Optimization, Prompt Engineering",
      },
    };

    let currentAgent = "cybersecurity";
    const conversationHistory = {
      cybersecurity: [],
      aiml: [],
    };

    const messagesEl = document.getElementById("messages");
    const messageInputEl = document.getElementById("messageInput");
    const sendBtnEl = document.getElementById("sendBtn");
    const serverStatusEl = document.getElementById("serverStatus");
    const charCountEl = document.getElementById("charCount");
    const agentBtnsEl = document.querySelectorAll(".agent-btn");

    let isLoading = false;
    let serverReady = false;
    let statusCheckTimer = null;

    // Check server status
    async function checkServerStatus() {
      try {
        const res = await fetch("/api/agents", { signal: AbortSignal.timeout(5000) });
        if (res.ok) {
          if (!serverReady) {
            serverStatusEl.textContent = "✅ Ready";
            serverStatusEl.classList.add("ready");
            messageInputEl.disabled = false;
            sendBtnEl.disabled = false;
            serverReady = true;
            console.log("✅ Server connected");
          }
          return true;
        }
      } catch (error) {
        if (serverReady) {
          serverStatusEl.textContent = "❌ Offline";
          serverStatusEl.classList.remove("ready");
          messageInputEl.disabled = true;
          sendBtnEl.disabled = true;
          serverReady = false;
          console.error("❌ Server disconnected");
        }
      }
      return false;
    }

    // Update character count
    messageInputEl.addEventListener("input", () => {
      const len = messageInputEl.value.length;
      charCountEl.textContent = `${len} / 5000`;
      charCountEl.classList.remove("warning", "error");
      if (len > 4500) charCountEl.classList.add("error");
      else if (len > 4000) charCountEl.classList.add("warning");
    });

    // Initialize
    async function init() {
      await checkServerStatus();
      updateAgentDisplay();
      messageInputEl.focus();
      // Check status on focus only (not polling)
      window.addEventListener("focus", checkServerStatus);
    }

    // Agent selection
    agentBtnsEl.forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".agent-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        currentAgent = btn.dataset.agent;
        updateAgentDisplay();
      });
    });

    function updateAgentDisplay() {
      const agent = AGENTS[currentAgent];
      document.getElementById("agentIcon").textContent = agent.icon;
      document.getElementById("agentName").textContent = agent.name;
      document.getElementById("agentSubtitle").textContent = agent.subtitle;
      renderMessages();
    }

    function renderMessages() {
      const msgs = conversationHistory[currentAgent];
      if (msgs.length === 0) {
        messagesEl.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">💬</div>
            <div>Start chatting with ${AGENTS[currentAgent].name}</div>
          </div>
        `;
        return;
      }

      messagesEl.innerHTML = msgs
        .map(
          (msg) => `
        <div class="message ${msg.role}">
          <div>
            <div class="message-sender">${msg.role === "user" ? "You" : AGENTS[currentAgent].name}</div>
            <div class="message-bubble">${escapeHtml(msg.content)}</div>
          </div>
        </div>
      `
        )
        .join("");

      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    async function sendMessage() {
      const message = messageInputEl.value.trim();
      if (!message || isLoading) return;

      isLoading = true;
      conversationHistory[currentAgent].push({ role: "user", content: message });
      messageInputEl.value = "";
      charCountEl.textContent = "0 / 5000";
      sendBtnEl.disabled = true;
      sendBtnEl.textContent = "⏳ Thinking...";
      renderMessages();

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 60000); // 60s timeout

        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            agent: currentAgent,
            messages: conversationHistory[currentAgent],
          }),
          signal: controller.signal,
        });

        clearTimeout(timeoutId);

        if (!res.ok) {
          const errorData = await res.json().catch(() => ({}));
          throw new Error(errorData.error || `Server error: ${res.status}`);
        }

        const data = await res.json();
        if (data.success && data.message) {
          conversationHistory[currentAgent].push({
            role: "assistant",
            content: data.message,
          });
          renderMessages();
        } else {
          throw new Error(data.error || "No response received");
        }
      } catch (error) {
        if (error.name === "AbortError") {
          console.error("Request timeout");
          alert("Request timed out - the API took too long to respond");
        } else {
          console.error("Chat error:", error.message);
          alert(`Error: ${error.message}`);
        }
        conversationHistory[currentAgent].pop();
        renderMessages();
      } finally {
        isLoading = false;
        sendBtnEl.disabled = false;
        sendBtnEl.textContent = "Send";
        messageInputEl.focus();
      }
    }

    sendBtnEl.addEventListener("click", sendMessage);
    messageInputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    init();

    // Check status when page becomes visible
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) checkServerStatus();
    });
  </script>
</body>
</html>
