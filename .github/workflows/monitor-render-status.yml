name: 🔍 Monitor Render Status

on:
  schedule:
    # Run every 5 minutes on weekdays (9 AM - 5 PM UTC)
    # Day of week: 1=Monday, 5=Friday
    - cron: '*/5 9-17 * * 1-5'

  # Allow manual trigger
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    name: Check Render Services Status

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Check Render Status
        id: render_check
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          python scripts/check_render_status.py > /tmp/render_report.txt 2>&1
          exit_code=$?

          # Save report content to output
          echo "report<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/render_report.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Set status
          if [ $exit_code -eq 0 ]; then
            echo "status=healthy" >> $GITHUB_OUTPUT
          else
            echo "status=warning" >> $GITHUB_OUTPUT
          fi

      - name: Create status artifact
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: render-status-report
          path: render_status.json
          retention-days: 7

      - name: Post status to PR comment
        if: github.event_name == 'pull_request' && steps.render_check.outputs.status == 'warning'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('render_status.json', 'utf8');
            const data = JSON.parse(report);

            const comment = `## 🔍 Render Status Report\n\n${data.report || 'No services found'}\n\n⚠️ Generated at: ${new Date().toISOString()}`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Print status summary
        run: |
          echo "=== RENDER STATUS REPORT ==="
          cat /tmp/render_report.txt
