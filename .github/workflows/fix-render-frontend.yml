name: Fix Render Frontend Deployment

on:
  workflow_dispatch:
    inputs:
      render_api_key:
        description: 'Render API Key'
        required: true
        type: string

jobs:
  fix-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Delete broken frontend and create new Static Site
        env:
          RENDER_API_KEY: ${{ inputs.render_api_key }}
        run: |
          NEW_REPO="https://github.com/KEVIN-NGUYENDAD/network-security-audit-frontend"

          echo "🔍 Fetching services..."
          SERVICES=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X GET "https://api.render.com/v1/services" \
            -H "Authorization: Bearer $RENDER_API_KEY")

          HTTP_STATUS=$(echo "$SERVICES" | grep "HTTP_STATUS:" | cut -d: -f2)
          RESPONSE=$(echo "$SERVICES" | sed '$d')

          echo "API Response: $RESPONSE"
          echo "HTTP Status: $HTTP_STATUS"
          echo ""

          FRONTEND_ID=$(echo "$RESPONSE" | jq -r '.[] | select(.name=="network-security-audit-frontend") | .id' 2>/dev/null)

          echo "Frontend ID: $FRONTEND_ID"
          echo ""

          if [ ! -z "$FRONTEND_ID" ] && [ "$FRONTEND_ID" != "null" ]; then
            echo "🗑️  Deleting broken frontend..."
            DELETE_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X DELETE "https://api.render.com/v1/services/$FRONTEND_ID" \
              -H "Authorization: Bearer $RENDER_API_KEY")

            DELETE_HTTP=$(echo "$DELETE_RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
            echo "Delete Response Status: $DELETE_HTTP"
            echo "✅ Deleted"
            sleep 15
          else
            echo "⚠️  No existing frontend service found, skipping deletion"
          fi

          echo ""
          echo "📦 Creating new Static Site frontend..."
          CREATE_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://api.render.com/v1/services" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "type": "static_site",
              "name": "network-security-audit-frontend",
              "repo": "'"$NEW_REPO"'",
              "branch": "main",
              "buildCommand": "cd network-security-audit/frontend && npm install && npm run build",
              "publishPath": "network-security-audit/frontend/build",
              "plan": "free",
              "region": "oregon",
              "envVars": [
                {
                  "key": "REACT_APP_API_URL",
                  "value": "https://network-security-audit-backend.onrender.com"
                }
              ]
            }')

          CREATE_HTTP=$(echo "$CREATE_RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          CREATE_BODY=$(echo "$CREATE_RESPONSE" | sed '$d')

          echo "Create Response Status: $CREATE_HTTP"
          echo "Create Response Body:"
          echo "$CREATE_BODY" | jq '.' 2>/dev/null || echo "$CREATE_BODY"
          echo ""

          if [ "$CREATE_HTTP" = "201" ] || [ "$CREATE_HTTP" = "200" ]; then
            echo "✅ Frontend service created successfully"
            SERVICE_ID=$(echo "$CREATE_BODY" | jq -r '.id' 2>/dev/null)
            echo "Service ID: $SERVICE_ID"
          else
            echo "❌ Failed to create frontend service"
            exit 1
          fi

          echo ""
          echo "✨ Done! Render deploying (2-3 minutes)..."
