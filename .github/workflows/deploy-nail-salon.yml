name: Deploy Nail Salon Check-In to Render

on:
  workflow_dispatch:  # Manual trigger
  push:
    branches: [ main ]
    paths:
      - 'nail_salon_checkin/**'
      - '.github/workflows/deploy-nail-salon.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Deploy to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: python3 << 'EOF'
import os
import requests
import json
import time

def log(msg, level="INFO"):
    symbols = {"INFO": "ℹ️", "SUCCESS": "✅", "ERROR": "❌", "WARN": "⚠️"}
    print(f"{symbols.get(level, level)} {msg}")

api_key = os.environ.get("RENDER_API_KEY")
if not api_key:
    log("RENDER_API_KEY not set", "ERROR")
    exit(1)

base_url = "https://api.render.com/v1"
service_name = "nail-salon-checkin"
headers = {"Authorization": f"Bearer {api_key}", "Content-Type": "application/json"}

log("Step 1: Creating or finding service...")

# Try to create service
create_payload = {
    "name": service_name,
    "type": "web_service",
    "repo": "https://github.com/kevin-nguyendad/huong-pharmacy-ai-copilot",
    "branch": "main",
    "rootDir": "nail_salon_checkin",
    "runtime": "python3",
    "buildCommand": "pip install -r requirements.txt",
    "startCommand": "gunicorn app:app --bind 0.0.0.0:$PORT",
    "autoDeploy": "yes"
}

try:
    response = requests.post(f"{base_url}/services", json=create_payload, headers=headers, timeout=30)
    if response.status_code == 201:
        log(f"Service created: {service_name}", "SUCCESS")
    elif response.status_code == 409:
        log("Service already exists", "WARN")
    else:
        log(f"Create failed (HTTP {response.status_code}): {response.text[:200]}", "WARN")
except Exception as e:
    log(f"Create error: {str(e)}", "WARN")

time.sleep(3)

log("Step 2: Triggering deployment...")

try:
    response = requests.post(
        f"{base_url}/services/{service_name}/deploys",
        json={"clearCache": "do_clear"},
        headers=headers,
        timeout=30
    )
    if response.status_code in [200, 201]:
        log("Deployment triggered!", "SUCCESS")
    else:
        log(f"Deploy status: HTTP {response.status_code}", "INFO")
except Exception as e:
    log(f"Deploy trigger error: {str(e)}", "WARN")

log("Waiting for app to start...", "INFO")
time.sleep(3)

log("Step 3: Checking app status...", "INFO")

for attempt in range(30):
    try:
        response = requests.get(f"https://{service_name}.onrender.com/health", timeout=5)
        if response.status_code == 200:
            log("🎉 APP IS LIVE!", "SUCCESS")
            print(f"\n✅ Deployment successful!")
            print(f"🌐 URL: https://{service_name}.onrender.com")
            print(f"🔐 Staff: https://{service_name}.onrender.com/staff-login")
            exit(0)
    except:
        pass

    if (attempt + 1) % 10 == 0:
        log(f"Waiting... ({(attempt+1)*2}s)", "INFO")
    time.sleep(2)

log("Deployment in progress (may take 2-5 minutes)", "INFO")
print(f"\n📊 Monitor at: https://dashboard.render.com/services/{service_name}")
EOF
