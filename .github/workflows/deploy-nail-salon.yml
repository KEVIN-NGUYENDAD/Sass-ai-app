name: Deploy Nail Salon Check-In to Render

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'nail_salon_checkin/**'
      - '.github/workflows/deploy-nail-salon.yml'
      - 'render.yaml'

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run Tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd nail_salon_checkin
          pip install -q -r requirements.txt

      - name: Run linter
        run: |
          cd nail_salon_checkin
          pip install -q flake8
          flake8 app.py --max-line-length=120 --ignore=E501,W503 || true

      - name: Verify app imports
        run: |
          cd nail_salon_checkin
          python -c "from app import app; print('✓ App imports successfully')"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    name: Deploy to Render
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -q requests

      - name: Trigger Render deployment
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          python3 << 'EOF'
          import os
          import requests
          import time

          api_key = os.environ.get("RENDER_API_KEY")
          if not api_key:
              print("⚠️ RENDER_API_KEY not configured - skipping deployment")
              exit(0)

          # Service ID for nail-salon-checkin on Render
          service_id = "srv_n8jnjpqbo7ec4d4dm2a0"

          try:
              # Trigger a new deployment
              response = requests.post(
                  f"https://api.render.com/v1/services/{service_id}/deploys",
                  headers={
                      "Authorization": f"Bearer {api_key}",
                      "Content-Type": "application/json"
                  },
                  json={}
              )

              if response.status_code == 201:
                  deploy = response.json()
                  print(f"✓ Deployment triggered: {deploy.get('id', 'unknown')}")
                  print(f"  Status: {deploy.get('status', 'unknown')}")
              elif response.status_code == 409:
                  print("⚠️ Deployment already in progress")
              else:
                  print(f"✗ Deployment failed: {response.status_code}")
                  print(f"  Response: {response.text}")
                  exit(1)
          except Exception as e:
              print(f"✗ Error triggering deployment: {e}")
              exit(1)
          EOF

      - name: Report deployment status
        run: |
          echo "✅ Render deployment triggered for nail-salon-checkin"
          echo "Check status at: https://dashboard.render.com/"
