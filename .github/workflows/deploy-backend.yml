name: Deploy Network Security Audit Backend

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'network-security-audit/backend/**'

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Deploy Backend to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          echo "🚀 Deploying backend to Render..."

          # Try to deploy existing service
          DEPLOY_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST 'https://api.render.com/v1/services/network-security-audit-backend/deploys' \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": "do_clear"}')

          DEPLOY_HTTP=$(echo "$DEPLOY_RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          DEPLOY_BODY=$(echo "$DEPLOY_RESPONSE" | sed '$d')

          echo "Deploy Response Status: $DEPLOY_HTTP"
          echo "Deploy Response Body:"
          echo "$DEPLOY_BODY" | jq '.' 2>/dev/null || echo "$DEPLOY_BODY"

          # Check if service doesn't exist
          if echo "$DEPLOY_HTTP" | grep -q "404"; then
            echo ""
            echo "ℹ️  Backend service doesn't exist yet, will be created on next manual trigger"
            echo "Or manually create it at https://dashboard.render.com"
          elif [ "$DEPLOY_HTTP" = "201" ] || [ "$DEPLOY_HTTP" = "200" ]; then
            echo "✅ Backend deployment triggered successfully"
          else
            echo "⚠️  Deployment response: $DEPLOY_HTTP"
          fi

          echo ""
          echo "✨ Deployment attempt complete!"
          echo "Backend URL: https://network-security-audit-backend.onrender.com"
