name: Deploy Network Security Audit Backend

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'network-security-audit/backend/**'

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Deploy Backend Service on Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          echo "🚀 Deploying backend to Render..."
          echo ""
          echo "⚠️  Note: Backend service must be manually created on Render dashboard first"
          echo "    at https://dashboard.render.com with these settings:"
          echo "    - Name: network-security-audit-backend"
          echo "    - Type: Web Service"
          echo "    - GitHub Repo: https://github.com/KEVIN-NGUYENDAD/network-security-audit-frontend"
          echo "    - Branch: main"
          echo "    - Runtime: Python"
          echo "    - Root Directory: network-security-audit/backend"
          echo "    - Build Command: pip install -r requirements.txt"
          echo "    - Start Command: gunicorn app:app --bind 0.0.0.0:\$PORT"
          echo ""

          # Try to deploy existing service
          DEPLOY_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST 'https://api.render.com/v1/services/network-security-audit-backend/deploys' \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": "do_clear"}')

          DEPLOY_HTTP=$(echo "$DEPLOY_RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          DEPLOY_BODY=$(echo "$DEPLOY_RESPONSE" | sed '$d')

          echo "Deploy Response Status: $DEPLOY_HTTP"
          echo "Deploy Response Body:"
          echo "$DEPLOY_BODY" | jq . 2>/dev/null || echo "$DEPLOY_BODY"

          if [ "$DEPLOY_HTTP" = "201" ] || [ "$DEPLOY_HTTP" = "200" ]; then
            echo ""
            echo "✅ Backend deployment triggered!"
          elif echo "$DEPLOY_HTTP" | grep -q "404"; then
            echo ""
            echo "❌ Backend service not found on Render"
            echo "📋 Please create it manually at https://dashboard.render.com/new"
            exit 1
          else
            echo ""
            echo "⚠️  Deployment request returned status $DEPLOY_HTTP"
          fi

          echo ""
          echo "Backend URL: https://network-security-audit-backend.onrender.com"
