name: Deploy Network Security Audit Backend

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'network-security-audit/backend/**'

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Create/Update Backend Service on Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          NEW_REPO="https://github.com/KEVIN-NGUYENDAD/network-security-audit-frontend"
          
          echo "🔍 Checking for existing backend service..."
          SERVICES=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" https://api.render.com/v1/services)
          
          BACKEND_ID=$(echo "$SERVICES" | jq -r '.[] | select(.service.name=="network-security-audit-backend") | .service.id' 2>/dev/null)
          OWNER_ID=$(echo "$SERVICES" | jq -r '.[0].service.ownerId' 2>/dev/null)
          
          echo "Backend ID: $BACKEND_ID"
          echo "Owner ID: $OWNER_ID"
          echo ""
          
          if [ -z "$BACKEND_ID" ] || [ "$BACKEND_ID" = "null" ]; then
            echo "📦 Creating new backend service..."
            CREATE_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://api.render.com/v1/services" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{
                "type": "web_service",
                "name": "network-security-audit-backend",
                "ownerId": "'"$OWNER_ID"'",
                "repo": "'"$NEW_REPO"'",
                "branch": "main",
                "rootDir": "network-security-audit/backend",
                "buildCommand": "pip install -r requirements.txt",
                "startCommand": "gunicorn app:app",
                "plan": "free",
                "region": "oregon",
                "envVars": [
                  {
                    "key": "FLASK_ENV",
                    "value": "production"
                  },
                  {
                    "key": "DEBUG",
                    "value": "False"
                  },
                  {
                    "key": "CORS_ORIGINS",
                    "value": "https://network-security-audit-frontend.onrender.com"
                  }
                ]
              }')
            
            CREATE_HTTP=$(echo "$CREATE_RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
            CREATE_BODY=$(echo "$CREATE_RESPONSE" | sed '$d')
            
            echo "Create Response Status: $CREATE_HTTP"
            echo "Create Response Body:"
            echo "$CREATE_BODY" | jq '.' 2>/dev/null || echo "$CREATE_BODY"
            
            if [ "$CREATE_HTTP" = "201" ] || [ "$CREATE_HTTP" = "200" ]; then
              echo "✅ Backend service created successfully"
            else
              echo "❌ Failed to create backend service"
              exit 1
            fi
          else
            echo "✅ Backend service already exists (ID: $BACKEND_ID)"
          fi
          
          echo ""
          echo "✨ Backend deployment complete!"
          echo "Backend URL: https://network-security-audit-backend.onrender.com"
